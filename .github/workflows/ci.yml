# Tests, lint and a debug APK for every pull request and every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core rules and the database)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Check the APK's permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          if grep 'uses-permission' perms.txt | grep -v -e 'android.permission.INTERNET' -e 'android.permission.WAKE_LOCK' -e 'android.permission.RECEIVE_BOOT_COMPLETED' -e 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'; then
            echo "::error::The APK asks for a permission it shouldn't."
            exit 1
          fi

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tasks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Keep test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 7
